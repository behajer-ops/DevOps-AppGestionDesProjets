apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - host: gestion-projets.local
    http:
      paths:
      - path: /api/(.*)
        pathType: ImplementationSpecific  # <-- Changé
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      - path: /(.*)
        pathType: ImplementationSpecific  # <-- Changé
        backend:
          service:
            name: frontend-service
            port:
              number: 80
